name: Inspect public brand assets
on:
  push:
    paths: ['.github/workflows/inspect-assets.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read public menu image references
        run: |
          python - <<'PY'
          import urllib.request, re
          url='https://burdegamix.pedizap.com.br/'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          text=urllib.request.urlopen(req, timeout=35).read().decode('utf-8', errors='replace')
          for m in list(re.finditer(r'<img\b[^>]*>',text,re.I))[:50]:
            print(text[max(0,m.start()-240):m.end()+100])
          PY
