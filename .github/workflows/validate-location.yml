name: Validate location and recovery
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python tools/sync_site.py --check
      - run: python -m unittest discover -s tests -v
      - run: node --check script.js && node --check config.js && node --check recovery.js
      - run: python gerar_html_unico.py --saida /tmp/burdega-check.html
