  <section class="location-card" aria-labelledby="location-card-title">
   <div class="location-card-heading">
    <div class="location-card-copy">
     <h2 id="location-card-title">Vem pro Burdega</h2>
     <p><span data-address>$shortAddress</span><br><strong>$cityLabel</strong></p>
    </div>
    <button type="button" class="copy-address" data-copy-address data-copy-value="$fullAddress" aria-label="Copiar endereço" title="Copiar endereço"><svg class="icon " width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button>
   </div>
   <div class="location-map" data-map-state="idle">
    <iframe class="location-card-frame" title="$mapTitle" src="about:blank" data-map-src="$embedUrl" width="600" height="250" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <div class="map-load-status" data-map-status role="status" aria-live="polite" hidden>Carregando mapa…</div>
    <noscript><style>.location-card-frame[data-map-src] { display: none; }</style><iframe class="location-card-frame" name="burdega-map" title="$mapTitle" src="$embedUrl" width="600" height="250" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></noscript>
   </div>
   <div class="location-card-actions">
   <a class="location-card-open" href="$mapsUrl" target="_blank" rel="noopener noreferrer" data-link="maps" aria-label="Abrir a localização da Burdega no Google Maps em uma nova aba"><span>Abrir no Google Maps</span><svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></a>
    <a class="map-retry" data-retry-map href="$embedUrl" target="burdega-map" aria-label="Recarregar mapa" title="Recarregar mapa"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 19.8 10M4.2 14a8 8 0 0 0 13.7 3.9"/></svg></a>
   </div>
  </section>
